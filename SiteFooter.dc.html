<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="background:var(--surface,#141915);border-top:1px solid var(--border,#29302a);padding:0 24px 32px;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text,#eef2ec)">
  <sc-if value="{{ showPartners }}" hint-placeholder-val="{{ true }}">
  <div style="max-width:1160px;margin:0 auto;padding:28px 0 24px;border-bottom:1px solid var(--border,#29302a);display:flex;flex-wrap:wrap;align-items:center;gap:16px 40px">
    <span style="font-size:14px;font-weight:600;color:var(--text-3,#a6afa4)">{{ tPartners }}</span>
    <div style="display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center">
      <img src="/assets/logos/ey.png" alt="EY" title="EY" width="48" height="48" style="display:block;width:48px;height:48px;object-fit:contain;border-radius:10px">
      <img src="/assets/logos/su-pef.png" alt="SU PEF" title="SU PEF" width="48" height="48" style="display:block;width:48px;height:48px;object-fit:contain;border-radius:10px">
      <img src="/assets/logos/esn-mendelu.png" alt="ESN MENDELU" title="ESN MENDELU" width="48" height="48" style="display:block;width:48px;height:48px;object-fit:contain;border-radius:10px">
      <img src="/assets/logos/usaf.png" alt="US.AF" title="US.AF" width="48" height="48" style="display:block;width:48px;height:48px;object-fit:contain;border-radius:10px">
      <img src="/assets/logos/sklub-pixie.png" alt="S-klub Pixie" title="S-klub Pixie" width="48" height="48" style="display:block;width:48px;height:48px;object-fit:contain;border-radius:10px;background:#ffffff">
      <img src="/assets/logos/vazbic.png" alt="Vazbič" title="Vazbič" width="48" height="48" style="display:block;width:48px;height:48px;object-fit:contain;border-radius:10px">
    </div>
  </div>
  </sc-if>
  <div style="max-width:1160px;margin:0 auto;padding-top:24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px;font-size:14px">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0">
      <img src="/assets/reIS_logo.svg" alt="reIS" width="28" height="28" style="display:block;width:28px;height:28px">
      <span style="color:var(--text-3,#a6afa4);line-height:1.5">{{ tIndependent }}</span>
    </div>
    <sc-if value="{{ en }}" hint-placeholder-val="{{ false }}">
    <nav style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px">
      <span style="display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px 16px"><span style="color:var(--text-4,#8f988d)">In Czech:</span>
      <a href="/o-nas" hreflang="cs" style="color:var(--text-2,#c8cfc6);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">About us</a>
      <a href="/spoluprace" hreflang="cs" style="color:var(--text-2,#c8cfc6);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">Partners</a>
      <a href="/bezpecnost" hreflang="cs" style="color:var(--text-2,#c8cfc6);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">Security</a>
      <a href="/soukromi" hreflang="cs" style="color:var(--text-2,#c8cfc6);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">Privacy</a></span>
      <a href="https://github.com/reis-mendelu" style="color:var(--text-2,#c8cfc6);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">GitHub</a>
      <a href="https://www.instagram.com/reis.mendelu/" style="color:var(--text-2,#c8cfc6);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">Instagram</a>
      <a href="mailto:reis.mendelu@gmail.com" style="color:var(--text-2,#c8cfc6);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">reis.mendelu@gmail.com</a>
    </nav>
    </sc-if>
    <sc-if value="{{ cs }}" hint-placeholder-val="{{ true }}">
    <nav style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px">
      <a href="/o-nas" style="color:var(--text-2,#c8cfc6);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">O nás</a>
      <a href="/spoluprace" style="color:var(--text-2,#c8cfc6);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">Spolupráce</a>
      <a href="/bezpecnost" style="color:var(--text-2,#c8cfc6);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">Bezpečnost</a>
      <a href="/soukromi" style="color:var(--text-2,#c8cfc6);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">Soukromí</a>
      <a href="https://github.com/reis-mendelu" style="color:var(--text-2,#c8cfc6);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">GitHub</a>
      <a href="https://www.instagram.com/reis.mendelu/" style="color:var(--text-2,#c8cfc6);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">Instagram</a>
      <a href="mailto:reis.mendelu@gmail.com" style="color:var(--text-2,#c8cfc6);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">reis.mendelu@gmail.com</a>
    </nav>
    </sc-if>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;300px&quot;},&quot;showPartners&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cs&quot;,&quot;en&quot;],&quot;default&quot;:&quot;cs&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.showPartners;
    const en = this.props.lang === 'en';
    return {
      showPartners: p === true || p === 'true', en, cs: !en,
      tPartners: en ? 'Working with us' : 'Spolupracují s námi',
      tIndependent: en ? 'Independent student project, not an official MENDELU product.' : 'Nezávislý studentský projekt, není oficiální produkt MENDELU.',
    };
  }
}
</script>
</body>
</html>

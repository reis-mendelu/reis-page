<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:rgba(255,255,255,0.94);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid #e5e7eb;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;position:relative">
  <div style="max-width:1160px;margin:0 auto;height:64px;padding:0 clamp(14px,5vw,24px);display:flex;align-items:center;justify-content:space-between;gap:clamp(10px,4vw,24px)">
    <a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#111827">
      <img src="/assets/reIS_logo.svg" alt="reIS" width="40" height="40" style="display:block;width:40px;height:40px">
      <span style="font-weight:700;font-size:22px;letter-spacing:-0.02em">reIS</span>
    </a>
    <div style="display:flex;align-items:center;gap:clamp(8px,3vw,24px)">
      <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
        <nav style="display:flex;align-items:center;gap:26px;font-size:14.5px;font-weight:500;height:64px">
          <a href="/#funkce" style="text-decoration:none;color:#374151;position:relative;height:64px;display:flex;align-items:center">Co umí</a>
          <a href="/#data" style="text-decoration:none;color:#374151;position:relative;height:64px;display:flex;align-items:center"><span>Data a bezpečnost</span><sc-if value="{{ aData }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#79be15"></span></sc-if></a>
          <a href="/spoluprace" style="text-decoration:none;color:#374151;position:relative;height:64px;display:flex;align-items:center"><span>Spolupráce</span><sc-if value="{{ aSpol }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#79be15"></span></sc-if></a>
        </nav>
      </sc-if>
      <a href="/navod" style="display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:8px;background:#111827;color:#ffffff;font-size:14.5px;font-weight:600;text-decoration:none;white-space:nowrap" style-hover="background:#1f2937;color:#ffffff">Stáhnout reIS</a>
      <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-label="Menu" style="all:unset;cursor:pointer;width:40px;height:40px;margin-right:-8px;display:grid;place-items:center;color:#111827">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
        </button>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ menuVisible }}" hint-placeholder-val="{{ false }}">
    <nav style="border-top:1px solid #e5e7eb;background:#ffffff;padding:8px 24px 16px;display:flex;flex-direction:column;font-size:16px;font-weight:500">
      <a href="/#funkce" onClick="{{ closeMenu }}" style="text-decoration:none;color:#111827;padding:12px 0;border-bottom:1px solid #f3f4f6">Co umí</a>
      <a href="/#data" onClick="{{ closeMenu }}" style="text-decoration:none;color:#111827;padding:12px 0;border-bottom:1px solid #f3f4f6">Data a bezpečnost</a>
      <a href="/spoluprace" onClick="{{ closeMenu }}" style="text-decoration:none;color:#111827;padding:12px 0">Spolupráce</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;64px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;data&quot;,&quot;tym&quot;,&quot;spoluprace&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { wide: typeof window === 'undefined' ? true : window.innerWidth >= 900, menuOpen: false };
  componentDidMount() {
    this.onResize = () => { const wide = window.innerWidth >= 900; if (wide !== this.state.wide) this.setState({ wide, menuOpen: false }); };
    window.addEventListener('resize', this.onResize);
    this.onResize();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const a = this.props.active ?? '';
    const { wide, menuOpen } = this.state;
    return {
      wide, narrow: !wide, menuOpen, menuVisible: !wide && menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      aData: a === 'data', aSpol: a === 'spoluprace',
      closeMenu: () => this.setState({ menuOpen: false }),
    };
  }
}
</script>
</body>
</html>

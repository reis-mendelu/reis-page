<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:var(--header-bg,rgba(13,17,14,0.88));backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border,#29302a);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;position:relative">
  <div style="max-width:1160px;margin:0 auto;height:64px;padding:0 clamp(14px,5vw,24px);display:flex;align-items:center;justify-content:space-between;gap:clamp(10px,4vw,24px)">
    <a href="{{ home }}" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text,#eef2ec)">
      <img src="/assets/reIS_logo.svg" alt="reIS" width="40" height="40" style="display:block;width:40px;height:40px">
      <span style="font-weight:700;font-size:22px;letter-spacing:-0.02em">reIS</span>
    </a>
    <div style="display:flex;align-items:center;gap:clamp(8px,3vw,24px)">
      <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
        <nav style="display:flex;align-items:center;gap:26px;font-size:14.5px;font-weight:500;height:64px">
          <a href="{{ hFunkce }}" style="text-decoration:none;color:var(--text-2,#c8cfc6);position:relative;height:64px;display:flex;align-items:center">{{ tFunkce }}</a>
          <a href="{{ hData }}" style="text-decoration:none;color:var(--text-2,#c8cfc6);position:relative;height:64px;display:flex;align-items:center"><span>{{ tData }}</span><sc-if value="{{ aData }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#79be15"></span></sc-if></a>
          <a href="/spoluprace" hreflang="cs" style="text-decoration:none;color:var(--text-2,#c8cfc6);position:relative;height:64px;display:flex;align-items:center;gap:6px"><span>{{ tSpol }}</span><sc-if value="{{ en }}" hint-placeholder-val="{{ false }}"><span title="in Czech" style="font-size:11px;font-weight:600;color:var(--text-4,#8f988d);border:1px solid var(--border-strong,#3b443c);border-radius:4px;padding:0 4px;line-height:16px">CZ</span></sc-if><sc-if value="{{ aSpol }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#79be15"></span></sc-if></a>
        </nav>
      </sc-if>
      <div style="display:flex;align-items:center;font-size:13.5px;font-weight:600;letter-spacing:0.02em;color:var(--text-5,#646d63)">
        <sc-if value="{{ en }}" hint-placeholder-val="{{ false }}">
          <a href="/" hreflang="cs" lang="cs" data-lang-switch="header" aria-label="Česky" style="display:inline-flex;align-items:center;height:40px;padding:0 4px;color:var(--text-4,#8f988d);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">CZ</a><span aria-hidden="true">/</span><span aria-current="true" style="display:inline-flex;align-items:center;height:40px;padding:0 4px;color:var(--text,#eef2ec)">EN</span>
        </sc-if>
        <sc-if value="{{ cs }}" hint-placeholder-val="{{ true }}">
          <span aria-current="true" style="display:inline-flex;align-items:center;height:40px;padding:0 4px;color:var(--text,#eef2ec)">CZ</span><span aria-hidden="true">/</span><a href="/en" hreflang="en" lang="en" data-lang-switch="header" aria-label="English" style="display:inline-flex;align-items:center;height:40px;padding:0 4px;color:var(--text-4,#8f988d);text-decoration:none" style-hover="color:var(--accent-text,#a5d85f)">EN</a>
        </sc-if>
      </div>
      <a href="{{ navod }}" style="display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:8px;background:#3f6212;color:#ffffff;font-size:14.5px;font-weight:600;text-decoration:none;white-space:nowrap" style-hover="background:#365314;color:#ffffff">{{ tGet }}</a>
      <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-label="Menu" style="all:unset;cursor:pointer;width:40px;height:40px;margin-right:-8px;display:grid;place-items:center;color:var(--text,#eef2ec)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
        </button>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ menuVisible }}" hint-placeholder-val="{{ false }}">
    <nav style="border-top:1px solid var(--border,#29302a);background:var(--bg,#0d110e);padding:8px 24px 16px;display:flex;flex-direction:column;font-size:16px;font-weight:500">
      <a href="{{ hFunkce }}" onClick="{{ closeMenu }}" style="text-decoration:none;color:var(--text,#eef2ec);padding:12px 0;border-bottom:1px solid var(--border-subtle,#1d231e)">{{ tFunkce }}</a>
      <a href="{{ hData }}" onClick="{{ closeMenu }}" style="text-decoration:none;color:var(--text,#eef2ec);padding:12px 0;border-bottom:1px solid var(--border-subtle,#1d231e)">{{ tData }}</a>
      <a href="/spoluprace" hreflang="cs" onClick="{{ closeMenu }}" style="text-decoration:none;color:var(--text,#eef2ec);padding:12px 0">{{ tSpolMenu }}</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;64px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;data&quot;,&quot;tym&quot;,&quot;spoluprace&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cs&quot;,&quot;en&quot;],&quot;default&quot;:&quot;cs&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// lang="en" is the English homepage (/en); anything else is Czech. The other
// pages are Czech only, so the switch there simply leads to /en.
const TEXT = {
  cs: { home: '/', hFunkce: '/#funkce', hData: '/#data', navod: '/navod', tFunkce: 'Co umí', tData: 'Data a bezpečnost', tSpol: 'Spolupráce', tSpolMenu: 'Spolupráce', tGet: 'Stáhnout reIS' },
  en: { home: '/en', hFunkce: '/en#funkce', hData: '/en#data', navod: '/navod?lang=en', tFunkce: 'Features', tData: 'Data & security', tSpol: 'Partners', tSpolMenu: 'Partners (in Czech)', tGet: 'Get reIS' },
};
class Component extends DCLogic {
  state = { wide: typeof window === 'undefined' ? true : window.innerWidth >= 900, menuOpen: false };
  componentDidMount() {
    this.onResize = () => { const wide = window.innerWidth >= 900; if (wide !== this.state.wide) this.setState({ wide, menuOpen: false }); };
    window.addEventListener('resize', this.onResize);
    this.onResize();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const a = this.props.active ?? '';
    const en = this.props.lang === 'en';
    const { wide, menuOpen } = this.state;
    return {
      ...TEXT[en ? 'en' : 'cs'], en, cs: !en,
      wide, narrow: !wide, menuOpen, menuVisible: !wide && menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      aData: a === 'data', aSpol: a === 'spoluprace',
      closeMenu: () => this.setState({ menuOpen: false }),
    };
  }
}
</script>
</body>
</html>

name: Generated pages
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: en/navod.html matches navod/index.html
        run: node scripts/navod-en.mjs --check
      - name: Every guide has the same Další návody / More guides list
        run: node scripts/guide-lists.mjs --check
